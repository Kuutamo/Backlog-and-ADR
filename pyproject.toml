[project]
name = "backlog-and-adr"
version = "0.1.0"
description = "Harjoitusprojekti: backlog-työkalu ja ADR-rekisteri"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "scripts"]

# --- Laatutyökalut (ADR-003) -------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["api", "tools"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["backend/src", "scripts/src"]
packages = ["api", "tools"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "scripts/tests"]
addopts = "-ra"

# Moduulirajat (ADR-002): backlog ja adr eivät saa riippua toisistaan.
[tool.importlinter]
root_packages = ["api"]

[[tool.importlinter.contracts]]
name = "Backlog- ja ADR-moduulit ovat toisistaan riippumattomia"
type = "independence"
modules = ["api.backlog", "api.adr"]
